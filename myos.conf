MYOS_LOCALE="en_IN.UTF-8"
MYOS_KEYBOARD="us"
MYOS_TIMEZONE="Asia/Kolkata"
# Build fails if the finished ISO is bigger than this many GB.
MYOS_MAX_GB=12
