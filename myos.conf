# MyOS build settings - sourced by build.sh and auto/config (plain sh syntax).
MYOS_NAME="MyOS"
MYOS_HOSTNAME="myos"
MYOS_USER="live"
# Debian stable codename. Confirmed as "trixie" (Debian 13) on 2026-11-14.
# build.sh warns if Debian's "stable" has since moved to a newer release.
