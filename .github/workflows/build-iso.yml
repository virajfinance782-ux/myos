# Builds the MyOS ISO on GitHub's servers - no Linux PC needed.
# Open the repository's "Actions" tab, choose "Build MyOS ISO", press "Run workflow",
# and download the ISO from the finished run's "Artifacts" section.
name: Build MyOS ISO
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['README.md', '.github/workflows/test-iso.yml', 'tools/ci-test.py']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build ISO
        run: sudo bash ./build.sh
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: MyOS-iso
          path: |
            MyOS-*-amd64.iso
            MyOS-*-amd64.iso.sha256
          compression-level: 0
          retention-days: 14
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
